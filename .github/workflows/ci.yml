name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Composer fetches dists from codeload.github.com, which rate-limits unauthenticated
  # requests. The automatic token needs no setup and raises the limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  # No tests read Markdown, so the shared default of the docs-only paths applies.
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  # Setup only; every check lives in bin/lint.sh (php-cs-fixer, Rector, PHPStan, clang-format,
  # shellcheck, hadolint). One PHP version is enough: these tools do not vary across runtimes.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ffi, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Pinned: the versions the image ships would change under us without a commit here.
      - name: Install clang-format, shellcheck and hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          PIPX_BIN_DIR="$HOME/.local/bin" pipx install clang-format==23.1.2
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          curl -fsSL -o "$HOME/.local/bin/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/clang-format" --version
          "$HOME/.local/bin/shellcheck" --version
          "$HOME/.local/bin/hadolint" --version

      - name: Lint
        run: bin/lint.sh

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        extensions: ffi, gd

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make

    - name: Build C++ FFI library
      working-directory: clib
      run: |
        rm -rf build
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCH=ON
        make -j"$(nproc)"

    # Runs the nayuki fixtures and the mask-penalty equivalence test on x86-64,
    # once per SIMD kernel (generic / avx2 / avx512), each followed by the C++
    # micro-benchmark on the same kernel — that is the only place the kernels
    # are timed against each other on identical hardware (dev machines are
    # arm64, and the hosted runner pool is mixed, so comparing numbers across
    # jobs compares CPUs, not kernels).
    # A kernel the runner's CPU cannot execute reports "SKIP" and passes —
    # forcing an unsupported ISA would SIGILL, so a runner without AVX-512
    # validates only the kernels it can actually run.
    - name: Test C++ library (all SIMD kernels)
      working-directory: clib/build
      run: |
        ctest --output-on-failure
        for k in generic avx2 avx512; do
          echo "== kernel: $k"
          SCANME_MASK_KERNEL=$k ./tests/test_penalty_equivalence 4 || exit 1
          SCANME_MASK_KERNEL=$k ./bench/scanme_bench 200 || exit 1
        done

    # Built the way PIE builds it: no CMake, no libscanme_qr, the C++ core
    # compiled straight into the extension. Until this ran here, php-ext was
    # only ever built by release-build.yml, so a break in it surfaced with the
    # release already tagged.
    - name: Build PHP extension
      working-directory: php-ext
      run: |
        phpize
        ./configure
        make -j"$(nproc)"

    - name: Test PHP extension
      working-directory: php-ext
      run: make test TESTS=tests NO_INTERACTION=1

    # The flattened layout the mirror ships takes the other branch of config.m4
    # and resolves its includes differently, so building it is the only way to
    # know the published package works.
    - name: Assemble and build the PIE package
      run: bash bin/build-ext-mirror.sh

    - name: Run test suite
      run: composer run-script test

    - name: Run test suite with the extension loaded
      run: php -d extension="$GITHUB_WORKSPACE/php-ext/modules/scanmeqr.so" vendor/bin/phpunit

  windows-path:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Test Windows build-tool detection
        run: php tests/windows-path-probe.php

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, test, windows-path]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
