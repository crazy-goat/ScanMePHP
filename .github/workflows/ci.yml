name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  check-permissions:
    runs-on: ubuntu-latest
    outputs:
      has-permissions: ${{ steps.check.outputs.has-permissions }}
    steps:
      - name: Check if actor has write permissions
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;
            
            // Always allow repo owner
            if (actor === owner) {
              core.setOutput('has-permissions', 'true');
              return;
            }
            
            // Check if actor has write permissions
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor
              });
              
              const allowedPermissions = ['admin', 'write', 'maintain'];
              if (allowedPermissions.includes(permission.permission)) {
                core.setOutput('has-permissions', 'true');
              } else {
                core.setOutput('has-permissions', 'false');
                core.info(`User ${actor} has permission level: ${permission.permission}. Skipping CI.`);
              }
            } catch (error) {
              core.setOutput('has-permissions', 'false');
              core.info(`Could not verify permissions for ${actor}. Skipping CI.`);
            }

  test:
    needs: check-permissions
    if: needs.check-permissions.outputs.has-permissions == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        extensions: ffi, gd

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make

    - name: Build C++ FFI library
      working-directory: clib
      run: |
        rm -rf build
        mkdir -p build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCH=ON
        make -j$(nproc)

    # Runs the nayuki fixtures and the mask-penalty equivalence test on x86-64,
    # once per SIMD kernel (generic / avx2 / avx512), each followed by the C++
    # micro-benchmark on the same kernel — that is the only place the kernels
    # are timed against each other on identical hardware (dev machines are
    # arm64, and the hosted runner pool is mixed, so comparing numbers across
    # jobs compares CPUs, not kernels).
    # A kernel the runner's CPU cannot execute reports "SKIP" and passes —
    # forcing an unsupported ISA would SIGILL, so a runner without AVX-512
    # validates only the kernels it can actually run.
    - name: Test C++ library (all SIMD kernels)
      working-directory: clib/build
      run: |
        ctest --output-on-failure
        for k in generic avx2 avx512; do
          echo "== kernel: $k"
          SCANME_MASK_KERNEL=$k ./tests/test_penalty_equivalence 4 || exit 1
          SCANME_MASK_KERNEL=$k ./bench/scanme_bench 200 || exit 1
        done

    # Built the way PIE builds it: no CMake, no libscanme_qr, the C++ core
    # compiled straight into the extension. Until this ran here, php-ext was
    # only ever built by release-build.yml, so a break in it surfaced with the
    # release already tagged.
    - name: Build PHP extension
      working-directory: php-ext
      run: |
        phpize
        ./configure
        make -j$(nproc)

    - name: Test PHP extension
      working-directory: php-ext
      run: make test TESTS=tests NO_INTERACTION=1

    # The flattened layout the mirror ships takes the other branch of config.m4
    # and resolves its includes differently, so building it is the only way to
    # know the published package works.
    - name: Assemble and build the PIE package
      run: bash bin/build-ext-mirror.sh

    - name: Run test suite
      run: composer run-script test

    # continue-on-error until #201 is fixed: the suite corrupts memory and
    # segfaults on roughly half of all runs, on main as much as here, and this
    # second pass doubles the exposure. The output still lands in the log, so a
    # failure this step introduces is visible; it just does not block a PR on a
    # crash that predates it.
    - name: Run test suite with the extension loaded
      continue-on-error: true
      run: php -d extension=$GITHUB_WORKSPACE/php-ext/modules/scanmeqr.so vendor/bin/phpunit
